<!doctype html>
<html>
<head>
  <script>
    try {
      window.localStorage.getItem('x')
    } catch (e) {
      const store = new Map()
      const shim = {
        getItem: (k) => (store.has(k) ? store.get(k) : null),
        setItem: (k, v) => { store.set(k, String(v)) },
        removeItem: (k) => { store.delete(k) },
        clear: () => { store.clear() },
        key: (i) => Array.from(store.keys())[i] ?? null,
        get length() { return store.size },
      }
      Object.defineProperty(window, 'localStorage', { value: shim, configurable: true })
    }
  </script>
  <style>

      --plus-color-bg-brand-tertiary: rgba(255, 159, 48, 0.16);
      --plus-color-bg-success-tertiary: rgba(0, 255, 157, 0.16);
      --plus-color-bg-component-tertiary: rgba(37, 99, 235, 0.12);
      --plus-color-bg-danger-tertiary: rgba(180, 35, 24, 0.12);
      --plus-color-text: #112033;
      --plus-color-text-secondary: #4f6277;

      font-size: var(--font-size-body);

      overflow: hidden;

      font-size: var(--font-size-label);
      color: var(--plus-color-text-secondary);

      text-overflow: ellipsis;
      white-space: nowrap;

<body>
  <div id="plugin-root">
    <div class="tab-bar">
      <div class="tabs">
        <button id="tab-bulk-btn" class="tab-button action-button active" type="button">Bulk edit</button>
        <button id="tab-dedup-btn" class="tab-button action-button" type="button">Deduplicator</button>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="true" title="Toggle dark mode">
        <span class="theme-toggle__track"><span class="theme-toggle__thumb"></span></span>
        <span id="theme-toggle-label" class="theme-toggle__label">Dark</span>
      </button>
    </div>
    <div class="content-area">
      <div id="tab-bulk" class="tab-panel active">
        <div class="search-row">
          <div class="search-wrap" id="var-search-wrap">
            <span class="search-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6.5" cy="6.5" r="4.5"/><line x1="10" y1="10" x2="14" y2="14"/></svg></span>
            <input id="var-search" class="search-input" placeholder="Search by name or value..." type="text">
            <button class="clear-btn" id="var-search-clear" title="Clear filter"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg></button>
          </div>
        </div>
        <div class="summary" id="bulk-summary"></div>
        <div class="column-headers" id="bulk-col-headers">
          <span class="col-cb"></span>
          <span class="col-header col-name active" data-col="name">Name <span class="sort-arrow">&#9650;</span></span>
          <span class="col-header col-value" data-col="value">Value <span class="sort-arrow">&#9650;</span></span>
          <span class="col-header col-type" data-col="type">Type <span class="sort-arrow">&#9650;</span></span>
          <span class="col-header col-collection" data-col="collection">Collection <span class="sort-arrow">&#9650;</span></span>
        </div>
        <div class="search-results-scroll" id="search-results-scroll">
          <div id="search-results">
            <div class="empty-state">Loading variables...</div>
          </div>
        </div>
        <div id="bulk-actions" class="bulk-actions hidden">
          <div class="bulk-action-row">
            <label>Rename</label>
            <select id="rename-mode" class="rename-mode">
              <option value="replace">Replace</option>
              <option value="prefix">Prefix</option>
              <option value="suffix">Suffix</option>
            </select>
          </div>
          <div class="bulk-action-row">
            <label></label>
            <input type="text" class="bulk-input" id="rename-input" placeholder="New name...">
            <button id="rename-btn" class="action-button" type="button">Rename</button>
          </div>
          <div class="bulk-action-row">
            <label>Set value</label>
            <input type="text" class="bulk-input" id="value-input" placeholder="New value...">
            <button id="value-btn" class="action-button" type="button">Apply</button>
          </div>
        </div>
      </div>
      <div id="tab-dedup" class="tab-panel">
        <div class="search-row">
          <div class="search-wrap" id="dedup-search-wrap">
            <span class="search-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6.5" cy="6.5" r="4.5"/><line x1="10" y1="10" x2="14" y2="14"/></svg></span>
            <input id="dedup-search" class="search-input" placeholder="Filter by name or value..." type="text">
            <button class="clear-btn" id="dedup-search-clear" title="Clear filter"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg></button>
          </div>
        </div>
        <div class="summary" id="dedup-summary"></div>
        <div class="column-headers" id="dedup-col-headers-fixed"></div>
        <div class="dedup-scroll" id="results"></div>
      </div>
    </div>
    <footer class="plugin-footer">
      <button id="rescan" class="action-button" type="button">Scan</button>
    </footer>
  </div>

  <script>
    function reportHeight() {}

    const tabBulkBtn = document.getElementById('tab-bulk-btn')
    const tabDedupBtn = document.getElementById('tab-dedup-btn')
    const tabDedup = document.getElementById('tab-dedup')
    const tabBulk = document.getElementById('tab-bulk')
    const rescanBtn = document.getElementById('rescan')
    const themeToggle = document.getElementById('theme-toggle')

    function applyTheme(theme) {
      const isLight = theme === 'light'
      const resolvedTheme = isLight ? 'light' : 'dark'
      document.documentElement.setAttribute('data-theme', resolvedTheme)
      document.body.setAttribute('data-theme', resolvedTheme)
      const themeLabel = document.getElementById('theme-toggle-label')
      if (themeToggle) {
        themeToggle.setAttribute('aria-pressed', resolvedTheme === 'dark' ? 'true' : 'false')
      }
      if (themeLabel) {
        themeLabel.textContent = resolvedTheme === 'dark' ? 'Dark' : 'Light'
      }
      window.localStorage.setItem('plus-theme', resolvedTheme)
    }

    const storedTheme = window.localStorage.getItem('plus-theme')
    const initialTheme = storedTheme || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    applyTheme(initialTheme)

    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'
        applyTheme(currentTheme === 'light' ? 'dark' : 'light')
      })
    }

    let currentTab = 'Bulk edit'

    function setTab(tab) {
      currentTab = tab
      const isBulk = tab === 'Bulk edit'
      tabBulk.classList.toggle('active', isBulk)
      tabDedup.classList.toggle('active', !isBulk)
      tabBulkBtn.classList.toggle('active', isBulk)
      tabDedupBtn.classList.toggle('active', !isBulk)
    }

    tabBulkBtn.addEventListener('click', () => setTab('Bulk edit'))
    tabDedupBtn.addEventListener('click', () => setTab('Deduplicator'))

    let bulkTotalVars = 0

    rescanBtn.addEventListener('click', () => {
      rescanBtn.disabled = true
      const origText = rescanBtn.textContent
      rescanBtn.textContent = 'Scanning...'

      const query = varSearchInput ? varSearchInput.value : (document.getElementById('var-search')?.value || '')
      lastQuery = (query || '').trim()

      parent.postMessage({ pluginMessage: { type: 'scan', query: lastQuery, searchBy: 'all' } }, '*')
      doSearch()

      setTimeout(() => {
        rescanBtn.disabled = false
        rescanBtn.textContent = origText
      }, 500)
    })

    let bulkResults = []
    let selectedIds = new Set()
    let lastQuery = ''

    let bulkSortCol = 'name'
    let bulkSortAsc = true

    function sortBulkResults(results) {
      const col = bulkSortCol
      const asc = bulkSortAsc
      return results.slice().sort((a, b) => {
        let va, vb
        if (col === 'name') { va = a.name.toLowerCase(); vb = b.name.toLowerCase() }
        else if (col === 'value') { va = a.valueLabel.toLowerCase(); vb = b.valueLabel.toLowerCase() }
        else if (col === 'collection') { va = a.collection.toLowerCase(); vb = b.collection.toLowerCase() }
        else if (col === 'type') { va = a.resolvedType; vb = b.resolvedType }
        else { va = a.name.toLowerCase(); vb = b.name.toLowerCase() }
        if (va < vb) return asc ? -1 : 1
        if (va > vb) return asc ? 1 : -1
        return 0
      })
    }

    function updateBulkColHeaders() {
      document.querySelectorAll('#bulk-col-headers .col-header').forEach(h => {
        const col = h.getAttribute('data-col')
        h.classList.toggle('active', col === bulkSortCol)
        const arrow = h.querySelector('.sort-arrow')
        arrow.innerHTML = bulkSortAsc ? '&#9650;' : '&#9660;'
      })
    }

    document.querySelectorAll('#bulk-col-headers .col-header').forEach(h => {
      h.addEventListener('click', () => {
        const col = h.getAttribute('data-col')
        if (bulkSortCol === col) {
          bulkSortAsc = !bulkSortAsc
        } else {
          bulkSortCol = col
          bulkSortAsc = true
        }
        updateBulkColHeaders()
        renderSearchResults(bulkResults, bulkResults.length, true)
      })
    })

    function updateBulkActions() {
      const panel = document.getElementById('bulk-actions')
      if (selectedIds.size === 0) {
        panel.classList.add('hidden')
      } else {
        panel.classList.remove('hidden')
      }
    }

    let searchTimer = null
    const varSearchInput = document.getElementById('var-search')
    const varSearchWrap = document.getElementById('var-search-wrap')
    const varSearchClear = document.getElementById('var-search-clear')

    function updateVarSearchWrap() {
      if (varSearchInput && varSearchWrap) {
        if (varSearchInput.value) {
          varSearchWrap.classList.add('has-value')
        } else {
          varSearchWrap.classList.remove('has-value')
        }
      }
    }

    function doSearch() {
      const query = varSearchInput ? varSearchInput.value : (document.getElementById('var-search')?.value || '')
      lastQuery = (query || '').trim()
      parent.postMessage({ pluginMessage: { type: 'search-vars', query: lastQuery, searchBy: 'all' } }, '*')
    }

    if (varSearchInput) {
      varSearchInput.addEventListener('input', () => {
        updateVarSearchWrap()
        if (searchTimer) clearTimeout(searchTimer)
        searchTimer = setTimeout(doSearch, 300)
      })
    }

    if (varSearchClear) {
      varSearchClear.addEventListener('click', () => {
        if (varSearchInput) {
          varSearchInput.value = ''
          updateVarSearchWrap()
          doSearch()
          varSearchInput.focus()
        }
      })
    }

    function renderSearchResults(results, total, preserveSelection) {
      const container = document.getElementById('search-results')
      bulkResults = results || []
      if (!preserveSelection) selectedIds.clear()

      const stillValidIds = new Set()
      if (preserveSelection) {
        for (const r of bulkResults) {
          if (selectedIds.has(r.id)) stillValidIds.add(r.id)
        }
        selectedIds = stillValidIds
      }

      const bulkSummaryEl = document.getElementById('bulk-summary')
      if (!results || results.length === 0) {
        container.innerHTML = '<div class="empty-state">No variables found' + (lastQuery ? ' matching your search.' : ' in this file.') + '</div>'
        bulkSummaryEl.textContent = bulkTotalVars + ' variables scanned, 0 results'
        document.getElementById('bulk-actions').classList.add('hidden')
        return
      }

      if (lastQuery) {
        bulkSummaryEl.textContent = bulkTotalVars + ' variables scanned, ' + results.length + ' result' + (results.length !== 1 ? 's' : '')
      } else {
        bulkSummaryEl.textContent = results.length + ' variables scanned'
      }

      const sorted = sortBulkResults(results)

      let html = ''
      html += '<div class="select-all-row"><input type="checkbox" id="select-all-cb"><label for="select-all-cb">Select all (' + results.length + ')</label></div>'

      sorted.forEach((v, vi) => {
        const isChecked = selectedIds.has(v.id)
        const displayName = v.name
        html += '<div class="search-result-item' + (isChecked ? ' selected' : '') + '" data-id="' + v.id + '" data-idx="' + vi + '">'
        html += '<input type="checkbox" class="sr-checkbox" data-id="' + v.id + '"' + (isChecked ? ' checked' : '') + '>'
        html += '<span class="sr-name col-name" title="' + escapeHtml(v.name) + '">' + escapeHtml(displayName) + '</span>'
        const aliasTag = v.isAlias && v.aliasTargetName
          ? '<span class="alias-tag" title="Alias \u2192 ' + escapeHtml(v.aliasTargetName) + '">\u2192 ' + escapeHtml(v.aliasTargetName) + '</span>'
          : ''
        html += aliasTag
        html += '<span class="sr-value col-value" title="' + escapeHtml(v.valueLabel) + '">' + escapeHtml(v.valueLabel) + '</span>'
        html += '<span class="type-badge col-type">' + v.resolvedType + '</span>'
        html += '<span class="var-collection col-collection">' + escapeHtml(v.collection) + '</span>'
        html += '</div>'
      })

      container.innerHTML = html
      updateBulkActions()

      document.getElementById('select-all-cb').addEventListener('change', (e) => {
        const checked = e.target.checked
        document.querySelectorAll('.sr-checkbox').forEach(cb => {
          cb.checked = checked
          const id = cb.getAttribute('data-id')
          if (checked) selectedIds.add(id)
          else selectedIds.delete(id)
          cb.closest('.search-result-item').classList.toggle('selected', checked)
        })
        updateBulkActions()
      })

      document.querySelectorAll('.sr-checkbox').forEach(cb => {
        cb.addEventListener('change', (e) => {
          e.stopPropagation()
          const id = cb.getAttribute('data-id')
          if (cb.checked) selectedIds.add(id)
          else selectedIds.delete(id)
          cb.closest('.search-result-item').classList.toggle('selected', cb.checked)
          updateBulkActions()
        })
      })

      document.querySelectorAll('.search-result-item').forEach(row => {
        row.addEventListener('click', (e) => {
          if (e.target.tagName === 'INPUT') return
          const cb = row.querySelector('.sr-checkbox')
          cb.checked = !cb.checked
          const id = cb.getAttribute('data-id')
          if (cb.checked) selectedIds.add(id)
          else selectedIds.delete(id)
          row.classList.toggle('selected', cb.checked)
          updateBulkActions()
        })
      })
    }

    document.getElementById('rename-btn').addEventListener('click', () => {
      const newName = document.getElementById('rename-input').value
      if (!newName) return
      const renameMode = document.getElementById('rename-mode').value.toLowerCase()
      parent.postMessage({ pluginMessage: {
        type: 'bulk-rename',
        varIds: [...selectedIds],
        newName,
        renameMode,
        resultIds: bulkResults.map(r => r.id)
      } }, '*')
    })

    document.getElementById('value-btn').addEventListener('click', () => {
      const newValue = document.getElementById('value-input').value
      if (!newValue && newValue !== '0') return
      const types = [...selectedIds].map(id => {
        const r = bulkResults.find(v => v.id === id)
        return r ? r.resolvedType : 'STRING'
      })
      const resolvedType = types[0] || 'STRING'
      parent.postMessage({ pluginMessage: {
        type: 'bulk-set-value',
        varIds: [...selectedIds],
        newValue,
        resolvedType,
        resultIds: bulkResults.map(r => r.id)
      } }, '*')
    })

    let dedupSortCol = 'count'
    let dedupSortAsc = false

    const selections = {}

    function sortDuplicates(duplicates) {
      const col = dedupSortCol
      const asc = dedupSortAsc
      return duplicates.slice().sort((a, b) => {
        let va, vb
        if (col === 'value') { va = a.valueLabel.toLowerCase(); vb = b.valueLabel.toLowerCase() }
        else if (col === 'type') { va = a.resolvedType; vb = b.resolvedType }
        else if (col === 'count') { va = a.variables.length; vb = b.variables.length }
        else if (col === 'alias') { va = a.variables.filter(v => v.isAlias).length; vb = b.variables.filter(v => v.isAlias).length }
        else { va = a.valueLabel.toLowerCase(); vb = b.valueLabel.toLowerCase() }
        if (va < vb) return asc ? -1 : 1
        if (va > vb) return asc ? 1 : -1
        return 0
      })
    }

    function renderResults(duplicates, totalVars, highlightCanonicalId) {
      const container = document.getElementById('results')
      const summaryEl = document.getElementById('dedup-summary')
      const colHeadersEl = document.getElementById('dedup-col-headers-fixed')

      if (!duplicates || duplicates.length === 0) {
        container.innerHTML = '<div class="empty-state">No duplicate raw values found across your variables.</div>'
        summaryEl.textContent = ''
        colHeadersEl.innerHTML = ''
        return
      }

      let totalDups = 0
      duplicates.forEach(g => totalDups += g.variables.length)

      const sorted = sortDuplicates(duplicates)

      summaryEl.textContent = totalVars + ' variables scanned, ' + totalDups + ' in ' + duplicates.length + ' duplicate groups'

      let colHtml = ''
      colHtml += '<span class="dedup-col-spacer"></span>'
      colHtml += '<span class="col-header' + (dedupSortCol === 'value' ? ' active' : '') + '" data-col="value" style="flex:1;">Value <span class="sort-arrow">' + (dedupSortAsc ? '&#9650;' : '&#9660;') + '</span></span>'
      colHtml += '<span class="col-header col-alias' + (dedupSortCol === 'alias' ? ' active' : '') + '" data-col="alias">Alias <span class="sort-arrow">' + (dedupSortAsc ? '&#9650;' : '&#9660;') + '</span></span>'
      colHtml += '<span class="col-header col-type' + (dedupSortCol === 'type' ? ' active' : '') + '" data-col="type">Type <span class="sort-arrow">' + (dedupSortAsc ? '&#9650;' : '&#9660;') + '</span></span>'
      colHtml += '<span class="col-header' + (dedupSortCol === 'count' ? ' active' : '') + '" data-col="count" style="width:50px;">Count <span class="sort-arrow">' + (dedupSortAsc ? '&#9650;' : '&#9660;') + '</span></span>'
      colHeadersEl.innerHTML = colHtml

      let html = ''

      sorted.forEach((group, gi) => {
        const aliasedCount = group.variables.filter(v => v.isAlias).length
        const allAliased = aliasedCount > 0 && aliasedCount === group.variables.length - 1
        const aliasHeaderTag = aliasedCount > 0
          ? '<span class="alias-count-tag' + (allAliased ? ' all-aliased' : '') + '">' + aliasedCount + ' aliased</span>'
          : ''
        const canonicalTag = aliasedCount > 0 && group.canonicalName
          ? '<span class="alias-tag">&#x2192; ' + escapeHtml(group.canonicalName) + '</span>'
          : ''
        const shouldOpen = highlightCanonicalId && group.variables.some(v => v.id === highlightCanonicalId)

        html += '<div class="group">'
        html += '<div class="group-header" data-group="' + gi + '">'
        html += '<span class="chevron' + (shouldOpen ? ' open' : '') + '" id="chev-' + gi + '">&#9654;</span>'
        html += '<button class="copy-btn" data-value="' + escapeHtml(group.valueLabel) + '" title="Copy value"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="8" height="8" rx="1.5"/><path d="M3 11V3.5A.5.5 0 013.5 3H11"/></svg></button>'
        if (group.resolvedType === 'COLOR' && group.valueLabel.startsWith('#')) {
          html += '<span class="color-swatch" style="background:' + escapeHtml(group.valueLabel) + ';"></span>'
        }
        html += '<span class="value-badge">' + escapeHtml(group.valueLabel) + '</span>'
        html += canonicalTag
        if (aliasedCount > 0) {
          html += aliasHeaderTag
        } else {
          html += '<span class="alias-placeholder"></span>'
        }
        html += '<span class="type-badge">' + group.resolvedType + '</span>'
        html += '<span class="count-badge">' + group.variables.length + '</span>'
        html += '</div>'
        html += '<div class="group-body' + (shouldOpen ? ' open' : '') + '" id="body-' + gi + '">'

        group.variables.forEach((v, vi) => {
          const radioName = 'group-' + gi
          const checked = vi === 0 ? 'checked' : ''
          if (vi === 0) selections[gi] = v.id
          const aliasTag = v.isAlias
            ? '<span class="alias-tag" title="Alias \u2192 ' + escapeHtml(v.aliasTargetName || '?') + '">\u2192 ' + escapeHtml(v.aliasTargetName || 'alias') + '</span>'
            : ''
          const detachBtn = v.isAlias
            ? '<button class="detach-btn" data-var-id="' + v.id + '">Detach</button>'
            : ''
          html += '<div class="var-row">'
          html += '<input type="radio" class="var-radio" name="' + radioName + '" value="' + v.id + '" ' + checked + ' data-group="' + gi + '">'
          html += '<span class="var-name" title="' + escapeHtml(v.name) + '">' + escapeHtml(v.name) + '</span>'
          html += aliasTag
          html += '<span class="var-collection">' + escapeHtml(v.collection) + '</span>'
          html += detachBtn
          html += '</div>'
        })

        const hasAliases = group.variables.some(v => v.isAlias)
        html += '</div>'
        html += '<div class="apply-row' + (shouldOpen ? '' : ' hidden') + '" id="apply-' + gi + '">'
        if (hasAliases) html += '<button class="detach-btn detach-all-btn" data-group="' + gi + '" type="button">Detach all</button>'
        html += '<button class="apply-btn action-button" data-group="' + gi + '" type="button">Alias to selected</button>'
        html += '</div></div>'
      })

      container.innerHTML = html

      document.querySelectorAll('#dedup-col-headers-fixed .col-header').forEach(h => {
        h.addEventListener('click', () => {
          const col = h.getAttribute('data-col')
          if (dedupSortCol === col) {
            dedupSortAsc = !dedupSortAsc
          } else {
            dedupSortCol = col
            dedupSortAsc = (col === 'count' || col === 'alias') ? false : true
          }
          filterDuplicates()
        })
      })

      document.querySelectorAll('.group-header').forEach(h => {
        h.addEventListener('click', () => {
          const gi = h.getAttribute('data-group')
          const body = document.getElementById('body-' + gi)
          const chev = document.getElementById('chev-' + gi)
          const applyRow = document.getElementById('apply-' + gi)
          body.classList.toggle('open')
          chev.classList.toggle('open')
          if (applyRow) applyRow.classList.toggle('hidden')
        })
      })

      document.querySelectorAll('.var-radio').forEach(r => {
        r.addEventListener('change', (e) => {
          selections[e.target.getAttribute('data-group')] = e.target.value
        })
      })

      document.querySelectorAll('.apply-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const gi = Number(btn.getAttribute('data-group'))
          const keepId = selections[gi]
          const group = sorted[gi]
          const aliasIds = group.variables.map(v => v.id).filter(id => id !== keepId)
          parent.postMessage({ pluginMessage: { type: 'apply-alias', keepId, aliasIds } }, '*')
        })
      })

      document.querySelectorAll('.detach-all-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const gi = Number(btn.getAttribute('data-group'))
          const group = sorted[gi]
          const aliasIds = group.variables.filter(v => v.isAlias).map(v => v.id)
          if (aliasIds.length > 0) {
            parent.postMessage({ pluginMessage: { type: 'detach-all', varIds: aliasIds } }, '*')
          }
        })
      })

      document.querySelectorAll('.detach-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation()
          const varId = btn.getAttribute('data-var-id')
          parent.postMessage({ pluginMessage: { type: 'detach-alias', varId } }, '*')
        })
      })

      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation()
          const val = btn.getAttribute('data-value')
          const ta = document.createElement('textarea')
          ta.value = val
          ta.style.position = 'fixed'
          ta.style.opacity = '0'
          document.body.appendChild(ta)
          ta.select()
          let ok = false
          try { ok = document.execCommand('copy') } catch (_) {}
          document.body.removeChild(ta)
          if (!ok) {
            try { navigator.clipboard.writeText(val) } catch (_) {}
          }
          btn.title = 'Copied!'
          setTimeout(() => { btn.title = 'Copy value' }, 1500)
        })
      })
    }

    function escapeHtml(str) {
      const d = document.createElement('div')
      d.textContent = str
      return d.innerHTML
    }

    let currentDuplicates = null
    let currentTotalVars = 0
    let currentHighlightId = null

    function filterDuplicates() {
      if (!currentDuplicates) return
      const query = (document.getElementById('dedup-search').value || '').trim().toLowerCase()
      if (!query) {
        renderResults(currentDuplicates, currentTotalVars, currentHighlightId)
        return
      }
      const filtered = currentDuplicates.filter(group => {
        const valueMatch = group.valueLabel.toLowerCase().includes(query)
        const nameMatch = group.variables.some(v => v.name.toLowerCase().includes(query))
        return nameMatch || valueMatch
      })
      renderResults(filtered, currentTotalVars, currentHighlightId)
    }

    const dedupSearchInput = document.getElementById('dedup-search')
    const dedupSearchWrap = document.getElementById('dedup-search-wrap')
    const dedupSearchClear = document.getElementById('dedup-search-clear')

    function updateDedupSearchWrap() {
      if (dedupSearchInput && dedupSearchWrap) {
        if (dedupSearchInput.value) {
          dedupSearchWrap.classList.add('has-value')
        } else {
          dedupSearchWrap.classList.remove('has-value')
        }
      }
    }

    let dedupSearchTimer = null
    if (dedupSearchInput) {
      dedupSearchInput.addEventListener('input', () => {
        updateDedupSearchWrap()
        if (dedupSearchTimer) clearTimeout(dedupSearchTimer)
        dedupSearchTimer = setTimeout(filterDuplicates, 200)
      })
    }

    if (dedupSearchClear) {
      dedupSearchClear.addEventListener('click', () => {
        if (dedupSearchInput) {
          dedupSearchInput.value = ''
          updateDedupSearchWrap()
          filterDuplicates()
          dedupSearchInput.focus()
        }
      })
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage
      if (!msg) return
      if (msg.type === 'scan-result') {
        currentDuplicates = msg.duplicates
        currentTotalVars = msg.totalVars
        currentHighlightId = msg.highlightCanonicalId
        filterDuplicates()
      }
      if (msg.type === 'search-result') {
        if (msg.totalVars != null) bulkTotalVars = msg.totalVars
        renderSearchResults(msg.results, msg.total, msg.preserveSelection)
      }
    }

    doSearch()
  </script>
</body>
</html>
